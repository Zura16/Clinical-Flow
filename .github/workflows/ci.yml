name: CI

# Runs on every push and pull request. Everything here works without a database: the two tests that
# need SQL Server skip themselves, and the nightly workflow covers that path.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Spark/Delta jars
        # configure_spark_with_delta_pip resolves the Delta and JDBC jars from Maven on first use;
        # without this the download runs on every job. Spark 4 keeps its Ivy cache in ~/.ivy2.5.2,
        # not ~/.ivy2: caching the old path saved nothing and the post step warned it was missing.
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate a small dataset
        # Small on purpose: these tests assert behaviour, not throughput, and the full-size set
        # would spend CI minutes proving nothing extra.
        run: python sample-data/generate_clinical_data.py --ehr-patients 200 --fhir-patients 50 --claims 200
      - name: Tests
        # Tests run against a temporary lakehouse (tests/conftest.py); the SQL Server tests skip,
        # and -rs prints each skip with its reason so a skip can never pass as a pass.
        run: python -m pytest tests -q -rs
