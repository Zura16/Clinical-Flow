services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinicalflow_sqlserver
    # SQL Server ships amd64 only; on Apple Silicon this runs under Docker Desktop's emulation.
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      - MSSQL_PID=Developer
      # CDC's capture and cleanup jobs are SQL Agent jobs: without the Agent, nothing is captured.
      - MSSQL_AGENT_ENABLED=true
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      # Read-only so BULK INSERT can load the generated extracts from inside the container.
      - ./sample-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  mssql_data:
